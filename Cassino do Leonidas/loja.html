<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loja de Colecionáveis - Cassino do Leônidas</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS da loja -->
    <link rel="stylesheet" href="loja.css">

</head>


<body>

    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="top-bar">

        <button
            class="back-button"
            onclick="window.location.href='index.html'"
        >
            ← VOLTAR
        </button>


        <div class="logo">

            <span class="logo-main">
                CASSINO
            </span>

            <span class="logo-sub">
                DO LEÔNIDAS
            </span>

        </div>


        <div class="gold-balance">

            <div class="gold-icon">
                ◆
            </div>

            <div class="gold-info">

                <span class="gold-label">
                    PEPITAS
                </span>

                <span id="gold-amount">
                    1000
                </span>

            </div>

        </div>

    </header>


    <!-- =====================================================
         CONTEÚDO DA LOJA
         ===================================================== -->

    <main class="shop-content">

        <h1>
            LOJA DE COLECIONÁVEIS
        </h1>

        <div class="gold-line"></div>


        <p class="shop-description">
            Colecione itens exclusivos do Cassino do Leônidas.
        </p>


        <!-- =================================================
             ESTANTE
             ================================================= -->

        <section class="shelf-section">

            <div
                id="shelf"
                class="shelf"
            >
                <!--
                    Os itens serão criados
                    automaticamente pelo JavaScript.
                -->
            </div>

        </section>


        <p
            id="empty-message"
            class="empty-message"
        >
            A loja ainda não possui colecionáveis.
        </p>

    </main>


    <script src="loja.js"></script>

</body>

</html>
